packages:
  - "native"
injectWorkspacePackages: true
minimumReleaseAge: 720 # 12 hours
minimumReleaseAgeExclude:
  - fast-xml-parser
  - follow-redirects

allowScripts:
  oxc-resolver: true

allowBuilds:
  "@mendable/firecrawl-rs": true
  "@sentry-internal/node-cpu-profiler": true
  "@sentry/cli": true
  bigint-buffer: true
  bufferutil: true
  four-flap-bigint-buffer: true
  esbuild: true
  keccak: true
  koffi: true
  libpq: true
  msgpackr-extract: true
  oxc-resolver: true
  protobufjs: true
  supabase: true
  unrs-resolver: true
  utf-8-validate: true
  wordpos: true

onlyBuiltDependencies:
  - "@mendable/firecrawl-rs"
  - "@sentry-internal/node-cpu-profiler"
  - "@sentry/cli"
  - bigint-buffer
  - bufferutil
  - four-flap-bigint-buffer
  - esbuild
  - keccak
  - koffi
  - libpq
  - msgpackr-extract
  - oxc-resolver
  - protobufjs
  - supabase
  - unrs-resolver
  - utf-8-validate
  - wordpos

overrides:
  bigint-buffer: "npm:four-flap-bigint-buffer@1.1.6"
  diff: "^8.0.3"
  ajv: "^8.18.0"
  fast-xml-builder: ">=1.1.6 <2.0.0"
  fast-xml-parser: "^5.7.0"
  fast-uri: ">=3.1.2 <4.0.0"
  "glob@>=10.2.0 <10.5.0": ">=10.5.0"
  "js-yaml@<3.14.2": ">=3.14.2"
  "qs@<6.14.2": ">=6.14.2"
  "minimatch@<10.2.3": ">=10.2.3"
  "bn.js@<5.2.3": ">=5.2.3"
  "@tootallnate/once@<3.0.1": ">=3.0.1"
  yauzl: "^3.2.1"
  undici: "7.24.1"
  "picomatch@<4.0.4": ">=4.0.4"
  "yaml@<2.8.3": ">=2.8.3"
  "smol-toml@<1.6.1": ">=1.6.1"
  handlebars: ">=4.7.9"
  "path-to-regexp@~0.1.12": "0.1.13"
  brace-expansion: ">=5.0.6"
  "ws@>=8.0.0 <9.0.0": ">=8.20.1 <9.0.0"
  "follow-redirects@<1.16.0": ">=1.16.0 <2.0.0"
  "tar@<7.5.11": ">=7.5.11"
