packages:
  - "."

minimumReleaseAge: 720 # 12 hours

onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  # GHSA-27r3-jxmh-p828: allow today's patched release through the age gate.
  - body-parser@2.4.0
  - ip-address@10.7.4
overrides:
  "body-parser@>=2.0.0 <2.4.0": "2.4.0"
  "path-to-regexp@<8.4.0": ">=8.4.0"
  "qs@<6.16.0": ">=6.16.0 <7.0.0"
  "esbuild@>=0.17.0 <0.28.1": "0.28.1"
  "tar@<7.5.11": ">=7.5.11"
  "glob@>=10.2.0 <10.5.0": ">=10.5.0"
  "minimatch@<10.2.3": ">=10.2.3"
  "picomatch@<4.0.4": ">=4.0.4"
  "cross-spawn@<7.0.5": ">=7.0.5"
  "proxy-addr@<2.0.8": "2.0.8"
  "ip-address@>=10.0.0 <10.7.4": "10.7.4"
  # GHSA-jqcg-44mw-7w3h: pin the 2.x line only. Exact 2.0.8 cannot
  # resolve to 3.x.
  "proxy-addr@>=2.0.0 <2.0.8": "2.0.8"
